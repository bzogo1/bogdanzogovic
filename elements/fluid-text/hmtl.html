<body>

  <div id="cursor"></div>
  <div id="grain"></div>

  <div id="type-input">
    <div class="ctrl"><label>DENSITY</label><input type="range" id="sl-d" min="2" max="18" value="9" step="0.1"></div>
    <div class="ctrl"><label>SPEED</label> <input type="range" id="sl-s" min="0" max="100" value="28"></div>
    <div class="ctrl"><label>TURB</label> <input type="range" id="sl-t" min="0" max="100" value="45"></div>
    <div class="ctrl"><label>FONT SIZE</label><input type="range" id="sl-f" min="10" max="100" value="100"></div>
    <input id="text-field" type="text" value="FLUID" placeholder="TYPE…" spellcheck="false" autocomplete="off">
    <button class="btn" id="btn-p">⏸</button>
  </div>
</body>
